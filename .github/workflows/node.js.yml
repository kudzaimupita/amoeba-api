
# This workflow installs dependencies, builds the source code, and runs tests.

name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_ENV: test
  PORT: 3001
  MONGODB_URL: mongodb://127.0.0.1:27017/amoeba-test
  JWT_SECRET: test-jwt-secret
  ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
  APP_AWS_ACCESS_KEY: test
  APP_AWS_ACCESS_SECRET: test
  MAILER_SEND_KEY: test
  API_URL: http://localhost:3001
  CLIENT_URL: http://localhost:3000
  BETA_WHITELIST_ENABLED: false
  TEST_EMAIL: test@example.com

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:ci
